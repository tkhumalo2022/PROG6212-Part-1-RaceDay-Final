name: Validate RaceDay Part 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Check submission
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          test -f README.md
          test -f SUBMISSION_CHECKLIST.md
          test -f docs/RaceDay_ERD.svg
          test -f docs/RaceDay_API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql
          test -f docs/SSMS_Verification_Queries.sql
          test -f docs/Evidence/github-actions-green.png

      - name: Check ERD
        shell: bash
        run: |
          test -s docs/RaceDay_ERD.svg
          grep -qi "<svg" docs/RaceDay_ERD.svg

      - name: Check API plan
        shell: bash
        run: |
          api_file="docs/RaceDay_API_Endpoint_Plan.md"
          grep -q "HTTP Method" "$api_file"
          grep -q "Role Required" "$api_file"
          grep -q "/api/auth/login" "$api_file"
          grep -q "/api/events" "$api_file"
          grep -q "/enrolments" "$api_file"
          grep -q "/payments" "$api_file"
          grep -q "/results" "$api_file"

      - name: Check SQL files
        shell: bash
        run: |
          sql_file="docs/RaceDay_Database.sql"
          grep -qi "SET QUOTED_IDENTIFIER ON" "$sql_file"
          grep -qi "CREATE TABLE dbo.Organiser" "$sql_file"
          grep -qi "CREATE TABLE dbo.Participant" "$sql_file"
          grep -qi "CREATE TABLE dbo.Event" "$sql_file"
          grep -qi "CREATE TABLE dbo.Race_Category" "$sql_file"
          grep -qi "CREATE TABLE dbo.Enrolment" "$sql_file"
          grep -qi "CREATE TABLE dbo.Payment" "$sql_file"
          grep -qi "CREATE TABLE dbo.Race_Result" "$sql_file"
          grep -qi "UX_Payment_OneSuccessfulPayment" "$sql_file"
          grep -qi "trg_Enrolment_UpdateCategoryCount" "$sql_file"
          grep -qi "trg_Payment_ValidateAmount" "$sql_file"
          grep -qi "SELECT TABLE_NAME" docs/SSMS_Verification_Queries.sql

      - name: Check README
        shell: bash
        run: |
          grep -qi "RaceDay" README.md
          grep -q "9bIzD1thA6c" README.md
          grep -q "github-actions-green.png" README.md
